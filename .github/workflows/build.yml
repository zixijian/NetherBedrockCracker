name: build
on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  compile-nbc:
    name: Compile Nether Bedrock Cracker to shared library (Android arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Setup Android NDK
        uses: nintendoadam/setup-ndk@v2
        with:
          ndk-version: r26b

      - name: Add Rust Target
        run: rustup target add aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Compile shared library (aarch64-linux-android)
        working-directory: src/main/rust
        run: |
          cargo ndk -t arm64-v8a build --release
          mv target/aarch64-linux-android/release/lib*bedrockcracker.so ../resources/libbedrockcracker.so

      - name: Compute SHA256 hash
        run: sha256sum src/main/resources/libbedrockcracker.so

      - name: Capture shared library
        uses: actions/upload-artifact@v4
        with:
          name: libbedrockcracker.so
          path: src/main/resources/libbedrockcracker.so

  build:
    name: Build Nether Bedrock Cracker Mod
    needs: compile-nbc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Capture shared library
        uses: actions/download-artifact@v4
        with:
          pattern: libbedrockcracker.*
          merge-multiple: true
          path: src/main/resources/
      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Setup JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: 23
          distribution: 'temurin'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew build
      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetherBedrockCracker-android-arm64
          path: build/libs/
